<!DOCTYPE html>
<html>
<head>
    <title>103092400005_Soal1</title>
    <link type="text/css" rel="stylesheet" href="style1.css">
</head>
<body onload="tampilkanData()">
    <form>
        <div class="form-group">
            <label>Nama</label>
            <input type="text" class="form-control" id="nama" readonly>
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" class="form-control" id="nim" readonly>
        </div>
    </form>

    <script type="text/javascript">
        function tampilkanData() {
            // Meminta input nama dari user
            var nama = prompt("Masukkan nama kamu:");
            // Meminta input NIM dari user
            var nim = prompt("Masukkan nim kamu:");

            // Menampilkan nama dan NIM ke dalam form
            document.getElementById("nama").value = nama;
            document.getElementById("nim").value = nim;
        }
    </script>

</body>
</html>
